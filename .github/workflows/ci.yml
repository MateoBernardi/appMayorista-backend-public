name: PR Quality & Code Guardrail
on:
  pull_request:
    branches: [ develop, main ]

# Previene ejecuciones redundantes si haces varios pushes seguidos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # =========================================================================
  # JOB: LINT, TESTS Y COBERTURA
  # =========================================================================
  quality-and-tests:
    name: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # 🎨 PASO DE ESTILO: Ejecuta ESLint/Prettier
      - name: Run Code Linter (Style)
        id: lint
        run: npm run lint || echo "LINT_FAILED=true" >> $GITHUB_ENV

      # 🧪 PASO DE TESTS: Ejecuta Jest/Vitest con Coverage incorporado
      - name: Run Tests with Coverage
        id: tests
        run: |
          set +e
          npm test -- --coverage | tee test_output.txt
          RC=$?
          echo "TESTS_EXIT_CODE=$RC" >> $GITHUB_ENV
          set -e
          exit $RC

      # =========================================================================
      # BOT INTELIGENTE: ANÁLISIS Y COMENTARIO EN LA PR
      # =========================================================================
      - name: 🤖 PR Quality Bot (Smart Report)
        if: always()
        uses: actions/github-script@v7
        env:
          LINT_FAILED: ${{ env.LINT_FAILED }}
          TESTS_EXIT_CODE: ${{ env.TESTS_EXIT_CODE }}
        with:
          script: |
            const fs = require('fs');
            
            // 1. Evaluar estados de los pasos anteriores
            const lintOk = process.env.LINT_FAILED !== "true";
            const testsOk = process.env.TESTS_EXIT_CODE === "0";
            
            // Intentar extraer métricas de cobertura de Jest sin bloquear por un mínimo
            let coverageInfoStr = "⚠️ No disponible";
            
            if (fs.existsSync("test_output.txt")) {
              const content = fs.readFileSync("test_output.txt", "utf8");
              // Regex estándar para buscar la línea "All files |   XX.XX |" de Istanbul/Jest
              const match = content.match(/All files\s+\|\s+([0-9.]+)\s+\|/);
              if (match && match[1]) {
                coverageInfoStr = `${match[1]}%`;
              } else if (testsOk) {
                coverageInfoStr = "✅ Reporte generado (Ver logs)";
              }
            }

            // 2. Calcular el Quality Score (Base 100: 50 Lint + 50 Tests)
            let score = 0;
            score += lintOk ? 50 : 0;
            score += testsOk ? 50 : 0;

            // 3. Determinar etapa fallida principal para dar feedback
            let failedStep = null;
            if (!lintOk) failedStep = "lint";
            else if (!testsOk) failedStep = "tests";

            const hints = {
              lint: [
                "Ejecutá `npm run lint` o `npx prettier --write .` localmente antes de subir código.",
                "Asegurate de que tu IDE aplique las reglas de formato automáticas al guardar."
              ],
              tests: [
                "Revisá los logs del paso 'Run Tests with Coverage' arriba para ver qué aserción falló.",
                "Asegurate de que no haya mocks mal configurados o variables de entorno faltantes."
              ]
            };

            // 4. Construir el reporte en Markdown
            let body = "## 🤖 Reporte de Calidad — Servidor Agéntico\n\n";
            body += `**Quality Score:** **${score}/100** ${score === 100 ? "🚀" : "❌"}\n\n`;
            body += `| Check Técnico | Estado |\n`;
            body += `|---|---|\n`;
            body += `| 🎨 Estilo de Código (Linter) | ${lintOk ? "✅ PASSED" : "❌ FAILED"} |\n`;
            body += `| 🧪 Pruebas Unitarias e Integración | ${testsOk ? "✅ PASSED" : "❌ CON ERRORES"} |\n`;
            body += `| 📈 Cobertura de Código (Informativo) | ${coverageInfoStr} |\n\n`;

            if (!failedStep) {
              body += "### ✅ ¡Todo excelente!\n";
              body += "El código cumple con los estándares de calidad requeridos y los tests pasaron exitosamente. Listo para revisión humana.\n";
            } else {
              body += `### ❌ Acción Requerida en la Etapa: *${failedStep.toUpperCase()}*\n`;
              body += "**Pistas sugeridas para solucionar el bloqueo:**\n";
              hints[failedStep].forEach(hint => {
                body += `- ${hint}\n`;
              });
              body += "\n_El botón de Merge permanecerá bloqueado hasta que soluciones estos puntos y hagas un nuevo push._\n";
            }

            // 5. Publicar o actualizar el comentario en la PR de manera limpia
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = "## 🤖 Reporte de Calidad — Servidor Agéntico";

            const comments = await github.rest.issues.listComments({
              owner, repo, issue_number, per_page: 100
            });

            const previous = comments.data.find(c => 
              c.user?.type === "Bot" && c.body?.includes(marker)
            );

            if (previous) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: previous.id, body
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number, body
              });
            }