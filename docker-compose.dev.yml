services:
  db-dev:
    image: postgis/postgis:17-3.5-alpine
    container_name: app-db-dev
    command: postgres -c timezone=America/Argentina/Buenos_Aires -c log_timezone=America/Argentina/Buenos_Aires
    environment:
      TZ: America/Argentina/Buenos_Aires
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: appmayorista_dev
    ports:
      - "5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_user -d appmayorista_dev"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pg_dev_data: